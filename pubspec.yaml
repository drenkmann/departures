name: departures
description: "An open source app trying to replicate the old BVG app."
publish_to: "none"

# MAJOR.MINOR.PATCH
# Increment MAJOR when introducing major changes/major rewrites
# Increment MINOR when introducing new features
# Increment PATCH when fixing bugs/refactoring
# Changes that do not modify code (e.g. README) should not increment the version number
version: 2.5.0+0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.20.2
  http: ^1.6.0
  permission_handler: ^13.0.2
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6
  provider: ^6.1.5
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  geolocator: ^14.1.2
  connectivity_plus: ^7.2.0
  dynamic_color: ^2.1.0
  restart_app: ^1.10.2
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  golden_screenshot: ^12.2.0

  geolocator_platform_interface: ^4.4.1
  connectivity_plus_platform_interface: ^2.1.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - test/fixtures/

flutter_launcher_icons:
  android: true
  min_sdk_android: 24
  image_path: "assets/icon/icon-full.png"
  adaptive_icon_foreground: "assets/icon/icon-foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon-foreground.png"
  adaptive_icon_background: "#f0d723"
